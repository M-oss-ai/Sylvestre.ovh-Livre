; =====================================================================
;  Réglages PHP appliqués à ce site (hébergement mutualisé : on n'a pas
;  accès au php.ini global). Fichier lu par PHP en FPM/CGI — c'est le
;  cas chez OVH. Les changements peuvent mettre jusqu'à 5 minutes à
;  être pris en compte (durée du cache de ce fichier, user_ini.ttl).
;
;  ⚠️ Ce fichier ne doit jamais être servi au navigateur : le .htaccess
;  bloque déjà tous les fichiers commençant par un point.
; =====================================================================

; --- Erreurs ---------------------------------------------------------
; Une trace d'erreur affichée révèle les chemins du serveur, les requêtes
; SQL et parfois des identifiants. On journalise, on n'affiche jamais.
display_errors = Off
display_startup_errors = Off
log_errors = On

; --- Sessions --------------------------------------------------------
; use_strict_mode : PHP refuse un identifiant de session qu'il n'a pas
; émis lui-même. Sans ça, un attaquant peut imposer au navigateur de sa
; victime un identifiant qu'il connaît, puis s'en servir une fois la
; victime connectée (fixation de session). PHP laisse ce réglage à 0
; par défaut, ce qui est un mauvais défaut.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; Identifiants de session plus longs et plus entropiques que le défaut.
session.sid_length = 48
session.sid_bits_per_character = 6

; Durée de vie côté SERVEUR. Le cookie peut être « de session » (fermé
; avec le navigateur), mais si le serveur oublie la session au bout de
; 24 minutes — le défaut — l'utilisateur est déconnecté en plein usage.
; 3 heures d'inactivité est un compromis raisonnable.
session.gc_maxlifetime = 10800

; --- Envois de fichiers ----------------------------------------------
; L'application refuse déjà au-delà de 3 Mo (IMAGE_TAILLE_MAX) et 5 Mo
; pour un import. On borne aussi au niveau de PHP : un fichier énorme
; est alors rejeté AVANT d'être entièrement reçu et écrit sur le disque.
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5

; --- Divers ----------------------------------------------------------
; N'annonce pas la version de PHP dans les en-têtes HTTP.
expose_php = Off
max_execution_time = 60
memory_limit = 128M
